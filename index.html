<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Data în Educație | Ghid pentru Studenți</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Source Sans 3', sans-serif;
            background-color: #ffffff;
            color: #1e293b;
            margin: 0;
        }
        h1, h2, h3, h4, .font-display {
            font-family: 'Playfair Display', serif;
        }
        .gradient-bg {
            background-color: #ffffff;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(236, 72, 153, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
        }
        .animate-fadeIn {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
</head>
<body class="gradient-bg min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONSTANTS ---
        const STATS = [
            {
                value: "15.3%",
                label: "Abandon școlar",
                description: "Rata abandonului școlar timpuriu în România (2024) - cea mai ridicată din UE.",
                color: "#6366f1",
                solution: "Early warning systems"
            },
            {
                value: "3x",
                label: "Diferență urban-rural",
                description: "Copiii din mediul rural au de 3 ori mai puține șanse să finalizeze liceul decât cei din urban.",
                color: "#ec4899",
                solution: "Alocare țintită de resurse"
            },
            {
                value: "43%",
                label: "Sub nivel minim",
                description: "Din elevii de 15 ani nu ating nivelul minim de competență în citire (PISA 2022).",
                color: "#06b6d4",
                solution: "Evaluare formativă continuă"
            },
            {
                value: "45K",
                label: "Deficit de cadre",
                description: "Lipsesc ~45.000 de profesori în sistem. Datele pot prioriza recrutarea.",
                color: "#f59e0b",
                solution: "HR analytics în educație"
            }
        ];

        const INITIATIVES = [
            {
                id: 1,
                title: "Copiii colectează date în grădiniță",
                org: "EDC - Engaging Preschoolers",
                tag: "Preșcolar",
                description: "Dezvoltă activități prin care copiii învață să colecteze și să 'vadă' date.",
                impact: "Educatoarele pot observa progresul în competențe numerice și științifice timpurii.",
                link: "https://edc.org/projects/engaging-preschoolers-in-data-collection-and-analysis"
            },
            {
                id: 2,
                title: "UNICEF folosește date pentru echitate",
                org: "UNICEF MICS-EAGLE",
                tag: "K-12 Global",
                description: "Ajută guvernele să identifice copiii excluși din educație și să măsoare rezultatele.",
                impact: "Alocare de resurse către comunitățile cu cele mai mari disparități.",
                link: "https://data.unicef.org/resources/mics-education-analysis-for-global-learning-and-equity/"
            },
            {
                id: 3,
                title: "PowerSchool: Decizii bazate pe date",
                org: "PowerSchool",
                tag: "K-12 US",
                description: "Transformă datele despre note și absențe în dashboards acționabile pentru profesori.",
                impact: "Identificarea rapidă a elevilor în risc de abandon și intervenții personalizate.",
                link: "https://www.powerschool.com/blog/7-steps-for-making-data-driven-decision-in-education/"
            }
        ];

        const CAREER_ROLES = [
            {
                id: "01",
                title: "Data Lead în școală",
                description: "Proiectezi instrumente de colectare, interpretezi datele și coordonezi intervenții educaționale bazate pe dovezi.",
                skills: ["Științele Educației", "Excel", "Vizualizare date"],
                miniProject: "Creează un sistem de tracking pentru progresul elevilor.",
                color: "#4f46e5"
            },
            {
                id: "02",
                title: "Coordonator M&E în ONG",
                description: "Măsori impactul programelor educaționale și raportezi către finanțatori.",
                skills: ["M&E", "Indicatori", "Management proiecte"],
                miniProject: "Dezvoltă un framework de M&E pentru un program fictiv.",
                color: "#0891b2"
            }
        ];

        // --- COMPONENTS ---
        const Navbar = ({ currentTab, setTab }) => (
            <nav className="sticky top-0 bg-white/80 backdrop-blur-xl border-b border-slate-100 z-50 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-20">
                        <div className="text-2xl font-bold text-slate-900 cursor-pointer font-display tracking-tight" onClick={() => setTab('home')}>
                            BigData<span className="text-indigo-600">.</span>Edu
                        </div>
                        <div className="hidden md:flex space-x-4">
                            {['home', 'career', 'funding'].map(t => (
                                <button key={t} onClick={() => setTab(t)} className={`text-sm font-bold transition-all px-4 py-2.5 rounded-xl ${currentTab === t ? 'text-white bg-indigo-600 shadow-lg shadow-indigo-200' : 'text-slate-500 hover:text-indigo-600 hover:bg-indigo-50'}`}>
                                    {t === 'home' ? 'De ce date?' : t === 'career' ? 'Carieră' : 'Finanțare'}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            </nav>
        );

        const StatCard = ({ stat }) => (
            <div className="bg-white rounded-2xl p-6 border transition-all hover:-translate-y-1 hover:shadow-lg text-left flex flex-col h-full shadow-sm" style={{ borderColor: `${stat.color}40` }}>
                <div className="text-3xl font-black font-display tracking-tight mb-1" style={{ color: stat.color }}>{stat.value}</div>
                <div className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-4">{stat.label}</div>
                <p className="text-sm text-slate-600 mb-5 leading-relaxed flex-grow font-light">{stat.description}</p>
                <div className="pt-4 border-t border-slate-50">
                    <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Potențială soluție</p>
                    <p className="text-xs font-bold text-slate-800">{stat.solution}</p>
                </div>
            </div>
        );

        const InitiativeCard = ({ initiative }) => (
            <div className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden hover:-translate-y-2 hover:shadow-2xl transition-all relative group shadow-sm flex flex-col p-8">
                <div className="mb-6 text-left">
                    <span className="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-black uppercase tracking-wider rounded-lg mb-4">{initiative.tag}</span>
                    <h3 className="text-xl font-bold text-slate-900 leading-tight mb-2 font-display">{initiative.title}</h3>
                    <p className="text-sm text-slate-400 font-semibold">{initiative.org}</p>
                </div>
                <p className="text-base text-slate-500 leading-relaxed font-light mb-6 text-left">{initiative.description}</p>
                <div className="mt-auto pt-8 border-t border-slate-50 text-left">
                    <a href={initiative.link} target="_blank" className="text-indigo-600 font-bold text-sm hover:translate-x-1 transition-all inline-block">Explorează proiectul →</a>
                </div>
            </div>
        );

        const CareerCard = ({ role }) => (
            <div className="bg-white rounded-[2rem] p-8 border border-slate-100 hover:shadow-2xl transition-all group shadow-sm relative overflow-hidden text-left" style={{ borderTop: `6px solid ${role.color}` }}>
                <h3 className="text-2xl font-bold text-slate-900 mb-4 font-display">{role.title}</h3>
                <p className="text-slate-500 mb-6 text-base leading-relaxed font-light">{role.description}</p>
                <div className="flex flex-wrap gap-2 mb-8">
                    {role.skills.map((s, i) => <span key={i} className="px-3 py-1 rounded-lg text-xs font-bold bg-slate-50 text-slate-500 border border-slate-100">{s}</span>)}
                </div>
                <div className="p-5 rounded-xl bg-slate-50 border-l-4" style={{ borderColor: role.color }}>
                    <p className="text-[9px] font-black text-slate-400 uppercase mb-2 tracking-widest">Mini-proiect recomandat:</p>
                    <p className="text-sm text-slate-700 italic font-medium">{role.miniProject}</p>
                </div>
            </div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [tab, setTab] = useState('home');

            useEffect(() => {
                const handleHash = () => {
                    const hash = window.location.hash.replace('#', '');
                    if (['home', 'career', 'funding'].includes(hash)) setTab(hash);
                };
                window.addEventListener('hashchange', handleHash);
                handleHash();
                return () => window.removeEventListener('hashchange', handleHash);
            }, []);

            const updateTab = (newTab) => {
                window.location.hash = newTab;
                setTab(newTab);
                window.scrollTo(0, 0);
            };

            return (
                <div className="min-h-screen bg-transparent text-slate-900 selection:bg-indigo-100 selection:text-indigo-900">
                    <Navbar currentTab={tab} setTab={updateTab} />

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
                        {tab === 'home' && (
                            <div className="animate-fadeIn">
                                <header className="text-center mb-24">
                                    <h1 className="text-4xl md:text-6xl font-black text-slate-900 mb-8 font-display tracking-tight max-w-4xl mx-auto">
                                        Transformă <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-pink-500 to-amber-500">datele</span> în decizii educaționale mai bune
                                    </h1>
                                    <p className="text-lg md:text-xl text-slate-500 max-w-3xl mx-auto leading-relaxed font-light">
                                        Ghidul tău practic pentru utilizarea dovezilor în educație. Explorează inițiative concrete și descoperă cum poți face diferența.
                                    </p>
                                </header>

                                <section className="mb-32">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                                        {STATS.map((stat, i) => <StatCard key={i} stat={stat} />)}
                                    </div>
                                </section>

                                <section className="mb-40">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                                        {INITIATIVES.map((init) => <InitiativeCard key={init.id} initiative={init} />)}
                                    </div>
                                </section>
                            </div>
                        )}

                        {tab === 'career' && (
                            <div className="animate-fadeIn">
                                <header className="text-center mb-24">
                                    <h1 className="text-4xl md:text-6xl font-black text-slate-900 mb-6 font-display tracking-tight">
                                        Harta ta de <span className="text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-rose-500">Carieră</span>
                                    </h1>
                                </header>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-10">
                                    {CAREER_ROLES.map((role) => <CareerCard key={role.id} role={role} />)}
                                </div>
                            </div>
                        )}

                        {tab === 'funding' && (
                            <div className="animate-fadeIn text-left">
                                <header className="text-center mb-20">
                                    <h1 className="text-4xl md:text-6xl font-black text-slate-900 mb-8 font-display tracking-tight">
                                        Cum <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-cyan-500">Finanțezi</span> o Inițiativă
                                    </h1>
                                </header>
                                <div className="bg-white p-12 rounded-[3rem] border border-slate-100 shadow-sm text-center">
                                    <p className="text-xl text-slate-500 font-light">Secțiunea de finanțare este în curs de actualizare cu noile apeluri Erasmus+ 2025.</p>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-white pt-24 pb-12 mt-32 text-left relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-emerald-500"></div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <p className="text-xs text-slate-500">© 2026 BigData.Edu | Material realizat sub egida Universității de Vest din Timișoara.</p>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
