                                                    <span className="text-4xl font-black text-cyan-500 mb-1 block font-display italic">ESF</span>
                                                    <h3 className="text-xl font-bold text-slate-900">ESF+</h3>
                                                </div>
                                                <span className="bg-cyan-50 px-4 py-1.5 rounded-full text-[9px] font-black text-cyan-400 border border-cyan-100 uppercase tracking-widest">2021-2027 | €99.3 bn</span>
                                            </div>
                                            <p className="text-slate-500 mb-6 text-base font-light leading-relaxed">{C.fundingSources.esf.desc}</p>
                                            <div className="space-y-4 mb-8">
                                                <p className="text-[10px] font-black text-cyan-500 uppercase tracking-widest border-l-4 border-cyan-500 pl-3">{C.ui.forDataProjects}</p>
                                                <ul className="text-base text-slate-500 space-y-2 list-disc pl-5 font-light">
                                                    {C.fundingSources.esf.projectList.map((item, i) => <li key={i}>{item}</li>)}
                                                </ul>
                                            </div>
                                            <div className="bg-cyan-50/50 p-8 rounded-2xl border-l-4 border-cyan-500 mb-6">
                                                <p className="text-[9px] font-black text-cyan-500 uppercase mb-2 tracking-widest">{C.ui.exampleProject}</p>
                                                <p className="text-sm text-slate-700 italic font-medium leading-relaxed">"{C.fundingSources.esf.example}"</p>
                                            </div>
                                            <a href="https://ec.europa.eu/european-social-fund-plus/ro" target="_blank" className="text-base font-bold text-cyan-500 hover:translate-x-1 transition-transform inline-block">{C.ui.exploreProgram} ESF+ →</a>
                                        </div>

                                        {/* Digital Europe */}
                                        <div className="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-2xl transition-all group">
                                            <div className="flex justify-between items-start mb-6">
                                                <div>
                                                    <span className="text-4xl font-black text-amber-500 mb-1 block font-display italic">DEP</span>
                                                    <h3 className="text-xl font-bold text-slate-900">Digital Europe Programme</h3>
                                                </div>
                                                <span className="bg-amber-50 px-4 py-1.5 rounded-full text-[9px] font-black text-amber-400 border border-amber-100 uppercase tracking-widest">2021-2027 | €7.5 bn</span>
                                            </div>
                                            <p className="text-slate-500 mb-6 text-base font-light leading-relaxed">{C.fundingSources.digital.desc}</p>
                                            <div className="space-y-4 mb-8">
                                                <p className="text-[10px] font-black text-amber-500 uppercase tracking-widest border-l-4 border-amber-500 pl-3">{C.ui.focusData}</p>
                                                <ul className="text-base text-slate-500 space-y-2 list-disc pl-5 font-light">
                                                    {C.fundingSources.digital.projectList.map((item, i) => <li key={i}>{item}</li>)}
                                                </ul>
                                            </div>
                                            <div className="bg-amber-50/50 p-8 rounded-2xl border-l-4 border-amber-500 mb-6">
                                                <p className="text-[9px] font-black text-amber-500 uppercase mb-2 tracking-widest">{C.ui.exampleProject}</p>
                                                <p className="text-sm text-slate-700 italic font-medium leading-relaxed">"{C.fundingSources.digital.example}"</p>
                                            </div>
                                            <a href="https://digital-strategy.ec.europa.eu/en" target="_blank" className="text-base font-bold text-amber-500 hover:translate-x-1 transition-transform inline-block">{C.ui.exploreProgram} DEP →</a>
                                        </div>
                                    </div>
                                </section>

                                {/* Oportunități Specifice */}
                                <section className="mb-32 py-20 bg-slate-900 rounded-[3.5rem] px-10 md:px-20 border border-slate-800 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-96 h-96 bg-indigo-500/10 blur-[120px] rounded-full translate-x-1/2 -translate-y-1/2"></div>
                                    <h2 className="text-2xl md:text-3xl font-display font-black text-white mb-12 text-center tracking-tight">{C.fundingPage.callsTitle}</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {C.fundingPage.calls.map((call, i) => {
                                            const colors = ['indigo', 'pink', 'cyan', 'amber'];
                                            const c = colors[i % 4];
                                            return (
                                                <div key={i} className="bg-white/5 backdrop-blur-md p-6 rounded-2xl border border-white/10 shadow-lg">
                                                    <div className={`text-[9px] font-black text-${c}-400 bg-${c}-500/10 px-2.5 py-1 rounded inline-block mb-4 uppercase tracking-[0.2em]`}>{call.status}</div>
                                                    <h4 className="font-bold text-white mb-3 text-base font-display">{call.title}</h4>
                                                    <p className="text-xs text-slate-400 mb-6 font-light leading-relaxed">{call.desc}</p>
                                                    <div className={`pt-4 border-t border-white/5 space-y-1.5 text-[10px] text-${c}-300 font-black uppercase tracking-widest`}>
                                                        <p>{call.budget}</p>
                                                        <p>{call.duration}</p>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </section>

                                {/* Cum Construiești o Propunere */}
                                <section className="mb-32">
                                    <h2 className="text-2xl md:text-3xl font-display font-black text-slate-900 mb-16 text-center tracking-tight">{C.fundingPage.proposalTitle}</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
                                        {C.fundingPage.proposalSteps.map((item, idx) => (
                                            <div key={idx} className="group relative">
                                                <div className="absolute -top-8 left-0 text-6xl font-black text-slate-50 group-hover:text-slate-100 transition-colors pointer-events-none">{idx + 1}</div>
                                                <h4 className={`text-lg font-bold mb-3 relative z-10 ${item.c}`}>{item.t}</h4>
                                                <p className="text-sm text-slate-500 font-light leading-relaxed relative z-10">{item.d}</p>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                {/* Resurse Utile */}
                                <section className="p-12 bg-white border border-slate-100 rounded-[2.5rem] shadow-sm text-center">
                                    <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em] mb-10">{C.fundingPage.resourcesTitle}</h3>
                                    <div className="flex flex-wrap justify-center gap-x-10 gap-y-6">
                                        {[
                                            { n: "Funding & Tenders Portal", l: "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home", c: "text-indigo-600" },
                                            { n: "Erasmus+ Programme Guide", l: "https://erasmus-plus.ec.europa.eu/programme-guide/erasmus-plus-programme-guide", c: "text-pink-500" },
                                            { n: "HE Work Programme", l: "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/how-to-participate/reference-documents", c: "text-cyan-500" },
                                            { n: "Digital Education Action Plan", l: "https://education.ec.europa.eu/focus-topics/digital-education/digital-education-action-plan", c: "text-amber-500" }
                                        ].map((res, i) => (
                                            <a 
                                                key={i} 
                                                href={res.l} 
                                                target="_blank" 
                                                className={`${res.c} font-bold text-[10px] uppercase tracking-widest transition-all hover:translate-y-[-1px] hover:brightness-110 border-b-2 border-transparent hover:border-current pb-1`}
                                            >
                                                {res.n}
                                            </a>
                                        ))}
                                    </div>
                                </section>
                            </div>
                        )}
                    </main>

                    {/* FOOTER */}
                    <footer className="bg-slate-900 text-white pt-24 pb-12 mt-32 text-left relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-pink-500 via-cyan-500 via-amber-500 to-emerald-500"></div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-16 mb-20">
                                <div className="md:col-span-2 text-left">
                                    <div className="text-3xl font-bold font-display mb-6 tracking-tighter text-white">BigData<span className="text-indigo-500">.</span>Edu</div>
                                    <p className="text-slate-400 text-lg leading-relaxed max-w-md font-light">
                                        {C.footer.desc}
                                    </p>
                                </div>
                                <div className="text-left">
                                    <h4 className="font-black mb-6 uppercase text-[9px] tracking-[0.3em] text-indigo-400">{C.footer.nav}</h4>
                                    <ul className="space-y-4 text-base text-slate-400 font-light">
                                        <li className="hover:text-white cursor-pointer transition-colors" onClick={() => updateTab('home')}>{C.nav.why}</li>
                                        <li className="hover:text-white cursor-pointer transition-colors" onClick={() => updateTab('career')}>{C.nav.career}</li>
                                        <li className="hover:text-white cursor-pointer transition-colors" onClick={() => updateTab('funding')}>{C.nav.funding}</li>
                                    </ul>
                                </div>
                                <div className="text-left">
                                    <h4 className="font-black mb-6 uppercase text-[9px] tracking-[0.3em] text-pink-400">{C.footer.partners}</h4>
                                    <div className="bg-white p-6 rounded-[1.5rem] shadow-xl border border-white/10 hover:scale-[1.02] transition-transform duration-300">
                                        <img src="logo.png" alt="Parteneri" className="w-full h-auto object-contain" />
                                    </div>
                                </div>
                            </div>

                            <div className="mb-20 p-10 rounded-[2.5rem] bg-white/5 backdrop-blur-md border border-white/10 text-left max-w-4xl">
                                <h4 className="text-[10px] font-black text-indigo-400 uppercase tracking-[0.4em] mb-5">{C.footer.programTitle}</h4>
                                <div className="space-y-4">
                                    <p className="text-lg text-slate-300 leading-relaxed italic font-light">
                                        {C.footer.programDesc}
                                    </p>
                                    <div className="flex flex-col md:flex-row md:items-center gap-4 pt-2">
                                        <p className="text-xs text-indigo-400 font-mono font-bold tracking-widest bg-indigo-500/10 px-3 py-1.5 rounded-lg border border-indigo-500/20 inline-block">
                                            Cod SMIS: 311901
                                        </p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="border-t border-white/5 pt-12 flex flex-col md:flex-row justify-between items-center gap-8 text-left">
                                <p className="text-xs text-slate-500 max-w-lg font-light">
                                    {C.footer.rights}
                                </p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        }
    </script>
</body>
</html>
